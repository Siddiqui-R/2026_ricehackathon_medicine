<!doctype html>
<!-- Static fallback: works for unknown hosted URLs even without JavaScript. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#B84250" />
    <meta name="robots" content="noindex" />
    <title>Page not found · Reva</title>
    <link rel="icon" type="image/svg+xml" href="/reva.svg" />
    <link rel="stylesheet" href="/src/styles/not-found.css" />
  </head>
  <body class="not-found-page">
    <main class="not-found-content">
      <p class="not-found-code">404</p>
      <h1>This page doesn’t exist.</h1>
      <p>The link may be incorrect or the page may have moved.</p>
      <a class="not-found-home" href="/">Back to home</a>
    </main>
  </body>
</html>
